  const go = document.getElementById("go"), err = document.getElementById("err"), field = document.getElementById("field"), label = go.textContent;
  const shake = () => { field.classList.remove("shake"); void field.offsetWidth; field.classList.add("shake"); };
  pwd.addEventListener("input", () => err.classList.remove("show"));
  document.getElementById("staticrypt-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!pwd.value) { shake(); return; }
    go.disabled = true; go.textContent = "正在打开…";
    await new Promise(r => setTimeout(r, 30));
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(pwd.value, document.getElementById("staticrypt-remember").checked);
    if (!isSuccessful) {
      go.disabled = false; go.textContent = label;
      err.textContent = templateError; err.classList.add("show"); shake(); pwd.select();
    }
  });
</script>
</body>
</html>
