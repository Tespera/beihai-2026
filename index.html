<html class="staticrypt-html" lang="zh-CN">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

.hidden{display:none!important}
.scene{position:fixed;inset:0;pointer-events:none}
.sun{position:absolute;top:7vh;right:9vw;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff3c4,#ffc76b 60%,#ffb14a);box-shadow:0 0 0 14px rgba(255,199,107,.18),0 0 0 30px rgba(255,199,107,.10)}
.cloud{position:absolute;height:26px;border-radius:26px;background:rgba(255,255,255,.85);animation:drift 38s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:34px;height:34px;left:14px;top:-16px}.cloud:after{width:24px;height:24px;left:40px;top:-10px}
.c1{width:96px;top:12vh;left:-120px}.c2{width:70px;top:22vh;left:-120px;animation-duration:52s;animation-delay:-20s;opacity:.8}
@keyframes drift{to{transform:translateX(calc(100vw + 240px))}}
.waves{position:absolute;left:0;right:0;bottom:0;height:22vh;min-height:130px}
.waves svg{position:absolute;bottom:0;width:200%;height:100%;animation:wave 14s linear infinite}
.waves svg:nth-child(2){animation-duration:20s;opacity:.7;bottom:10px}
.waves svg:nth-child(3){animation-duration:28s;opacity:.5;bottom:22px}
@keyframes wave{to{transform:translateX(-50%)}}
.wrap{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px calc(18vh + env(safe-area-inset-bottom))}
.art{width:min(300px,78vw);margin-bottom:-26px;position:relative;z-index:1;filter:drop-shadow(0 10px 18px rgba(40,110,120,.18))}
.art .boat{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.card{width:min(380px,100%);background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  border:1px solid rgba(255,255,255,.9);border-radius:30px;padding:40px 24px 24px;box-shadow:0 20px 50px -18px rgba(20,90,100,.35)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#0b7d77;background:#e3f5f3;border-radius:999px;padding:3px 10px}
h1{font-size:30px;line-height:1.15;margin:12px 0 6px;letter-spacing:.02em}
.sub{margin:0 0 22px;color:#5b6b74;font-size:14.5px}
.field{position:relative}
#staticrypt-password{width:100%;height:54px;border-radius:999px;border:1.5px solid transparent;background:#eef5f6;padding:0 54px 0 22px;font-size:17px;color:#12343f;outline:none;transition:.2s;-webkit-appearance:none}
#staticrypt-password::placeholder{color:#9aa9af}
#staticrypt-password:focus{background:#fff;border-color:#14a098;box-shadow:0 0 0 4px rgba(20,160,152,.14)}
.eye{position:absolute;right:8px;top:7px;width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#7d8e94}
.eye svg{width:20px;height:20px}
.err{min-height:20px;margin:8px 4px 0;font-size:13px;color:#e03131;opacity:0;transition:opacity .2s}
.err.show{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.remember{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 18px;font-size:14px;color:#3d4e57;cursor:pointer;user-select:none;-webkit-user-select:none}
.remember input{position:absolute;opacity:0;pointer-events:none}
.switch{width:46px;height:28px;border-radius:999px;background:#d6e2e5;position:relative;transition:.2s;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.remember input:checked+.switch{background:#14a098}
.remember input:checked+.switch:after{transform:translateX(18px)}
.go{width:100%;height:54px;border:0;border-radius:999px;font-size:17px;font-weight:650;color:#fff;cursor:pointer;letter-spacing:.04em;

.go[disabled]{filter:saturate(.6) brightness(1.05);cursor:progress}
.foot{margin-top:16px;text-align:center;font-size:12px;color:#8a979e}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#14a098;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-8px);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
